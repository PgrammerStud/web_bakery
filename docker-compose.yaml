services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_bakery_app
    volumes:
      - ./src:/app/src
      - ./templates:/app/templates
      - ./public:/app/public
      - ./var:/app/var
    ports:
      - "8000:80"
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0.32&charset=utf8mb4"
      APP_ENV: dev
      APP_DEBUG: "1"
      MERCURE_URL: http://mercure:80/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost:3000/.well-known/mercure
      MERCURE_JWT_SECRET: 'af87a332d040866e12ad9c9695e6b83c8f554b6555e18cc30944fa33bc774918'
    depends_on:
      - mysql
      - mercure
    networks:
      - webbakery_network


  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3312:3306"  
    volumes:
      - mysql_data_webbakery:/var/lib/mysql
    networks:
      - webbakery_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8085:80"    
    depends_on:
      - mysql
    networks:
      - webbakery_network

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: 'af87a332d040866e12ad9c9695e6b83c8f554b6555e18cc30944fa33bc774918'
      MERCURE_SUBSCRIBER_JWT_KEY: 'af87a332d040866e12ad9c9695e6b83c8f554b6555e18cc30944fa33bc774918'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:4200  http://127.0.0.1:8000  http://localhost:8000
        anonymous 1
    ports:
      - "3000:80"
    networks:
      - webbakery_network

volumes:
  mysql_data_webbakery:

networks:
  webbakery_network: